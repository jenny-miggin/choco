# Keeps trying to reproduce chocolatey/choco#3902 on GitHub Actions (windows-latest).
# - Scheduled every 4 hours on repro/process-tree-hang
# - Each run: optional multiple full builds, then many choco search loops until timeout or cap
# - Job fails when hang is reproduced (so you get notified); succeeds when no hang (schedule keeps trying)

name: 'Repro #3902 Process Tree'

on:
  schedule:
    # Every 4 hours (UTC). Disable by removing this block when done investigating.
    - cron: '17 */4 * * *'
  push:
    branches:
      - repro/process-tree-hang
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Source to build (develop = stock, no timeout fix)'
        required: true
        default: develop
        type: string
      hang_timeout_seconds:
        description: 'Per choco search timeout (seconds)'
        required: true
        default: '90'
        type: string
      max_search_attempts:
        description: 'Max search loops per build before this job gives up'
        required: true
        default: '200'
        type: string
      build_rounds:
        description: 'Full CI builds per job (rebuild from scratch each round)'
        required: true
        default: '3'
        type: string
      skip_full_build:
        description: 'Skip build; only loop repro against existing code_drop'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: repro-3902-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repro-windows:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      REPRO_GIT_REF: ${{ github.event.inputs.git_ref || 'develop' }}
      REPRO_TIMEOUT_SECONDS: ${{ github.event.inputs.hang_timeout_seconds || '90' }}
      REPRO_MAX_ATTEMPTS: ${{ github.event.inputs.max_search_attempts || '200' }}
      REPRO_BUILD_ROUNDS: ${{ github.event.inputs.build_rounds || '3' }}
      REPRO_SKIP_BUILD: ${{ github.event.inputs.skip_full_build || 'false' }}
    steps:
      - name: Checkout source under test
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REPRO_GIT_REF }}
          fetch-depth: 0

      - name: Cache Cake tools
        uses: actions/cache@v4
        with:
          path: tools
          key: ${{ runner.os }}-tools-${{ hashFiles('recipe.cake') }}

      - name: Install dotnet (GitVersion)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 5.0.x

      - name: Report runner environment
        shell: pwsh
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Ref under test: $env:REPRO_GIT_REF"
          Write-Host "Build rounds: $env:REPRO_BUILD_ROUNDS"
          Write-Host "Max search attempts per build: $env:REPRO_MAX_ATTEMPTS"
          Write-Host "Trigger: ${{ github.event_name }}"
          Write-Host "SHA: $(git rev-parse HEAD)"
          dotnet --info

      - name: Ensure repro script is present
        shell: pwsh
        run: |
          $scriptPath = '.github/scripts/Repro-ProcessTreeHang.ps1'
          if (Test-Path -LiteralPath $scriptPath) { exit 0 }
          git fetch origin repro/process-tree-hang --depth=1
          New-Item -ItemType Directory -Force -Path .github/scripts | Out-Null
          git show "origin/repro/process-tree-hang:.github/scripts/Repro-ProcessTreeHang.ps1" | Set-Content -Path $scriptPath -Encoding utf8NoBOM

      # CI target runs PSScriptAnalyzer via Cake; needs NuGet/PackageManagement cmdlets on the runner.
      - name: Install PowerShell modules for Cake build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module -Name PackageManagement, PowerShellGet -Repository PSGallery -Force -Scope CurrentUser -AllowClobber
          Get-PackageProvider -ListAvailable | Format-Table Name, Version

      - name: Build and repro until hang or rounds exhausted
        id: repro_loop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildRounds = [int]$env:REPRO_BUILD_ROUNDS
          $maxAttempts = [int]$env:REPRO_MAX_ATTEMPTS
          $timeoutSec = [int]$env:REPRO_TIMEOUT_SECONDS
          $skipBuild = $env:REPRO_SKIP_BUILD -eq 'true'

          $chocoExe = $null
          $hangFound = $false

          for ($round = 1; $round -le $buildRounds; $round++) {
            Write-Host ""
            Write-Host "========== Build round $round of $buildRounds =========="

            if (-not $skipBuild) {
              if ($round -gt 1 -and (Test-Path -LiteralPath 'code_drop')) {
                Write-Host 'Removing code_drop before rebuild...'
                Remove-Item -LiteralPath 'code_drop' -Recurse -Force -ErrorAction SilentlyContinue
              }
              # Same flags as .github/workflows/build.yml windows-build (known good on GHA).
              & ./build.ps1 --verbosity=diagnostic --target=CI --testExecutionType=unit --shouldRunOpenCover=false --shouldBuildMsi=true
              if ($LASTEXITCODE -ne 0) {
                if (Test-Path -LiteralPath 'code_drop/MsBuild.log') {
                  Write-Host '--- tail code_drop/MsBuild.log ---'
                  Get-Content -LiteralPath 'code_drop/MsBuild.log' -Tail 80
                }
                Write-Error "build.ps1 failed in round $round with exit $LASTEXITCODE (often PSScriptAnalyzer / Get-PackageProvider if modules step was skipped)"
                exit 1
              }
            }

            $candidates = @(
              'code_drop/temp/_PublishedApps/choco_merged/choco.exe',
              'code_drop/temp/_PublishedApps/choco/choco.exe'
            )
            $chocoExe = $null
            foreach ($path in $candidates) {
              if (Test-Path -LiteralPath $path) {
                $chocoExe = (Resolve-Path -LiteralPath $path).Path
                break
              }
            }
            if (-not $chocoExe) {
              $found = Get-ChildItem -Path code_drop -Recurse -Filter choco.exe -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $chocoExe = $found.FullName }
            }
            if (-not $chocoExe) {
              Write-Error "choco.exe not found after build round $round"
              exit 1
            }
            Write-Host "Using choco.exe: $chocoExe"

            & ./.github/scripts/Repro-ProcessTreeHang.ps1 `
              -ChocoExe $chocoExe `
              -Mode UntilHang `
              -TimeoutSeconds $timeoutSec `
              -MaxAttempts $maxAttempts

            $reproExit = $LASTEXITCODE
            if ($reproExit -eq 2) {
              Write-Host "::notice::#3902 hang reproduced in build round $round"
              "hang_reproduced=true" >> $env:GITHUB_OUTPUT
              "hang_build_round=$round" >> $env:GITHUB_OUTPUT
              $hangFound = $true
              break
            }
            if ($reproExit -ne 0) {
              Write-Error "Repro script failed with exit $reproExit in round $round"
              exit 1
            }

            Write-Host "Round $round : no hang after $maxAttempts search attempts."
            $skipBuild = $false
          }

          if ($hangFound) {
            Write-Host "::error::#3902 process tree hang reproduced — see repro-3902 artifacts and HANG-REPRODUCED.txt"
            # Fail the job so GitHub notifies you; see Job summary for details.
            exit 1
          }

          Write-Host "::warning::No hang after $buildRounds full build(s) and $maxAttempts searches per build. Scheduled run will try again."
          "hang_reproduced=false" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Upload repro logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-3902-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/repro-3902/**
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-3902-build-${{ github.run_id }}
          path: |
            code_drop/MsBuild.log
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        shell: pwsh
        run: |
          $hang = '${{ steps.repro_loop.outputs.hang_reproduced }}'
          if ($hang -eq 'true') {
            @"
          ## #3902 hang reproduced on this runner
          Build round: ${{ steps.repro_loop.outputs.hang_build_round }}
          Download artifact ``repro-3902-logs-${{ github.run_id }}`` and attach to the GitHub issue.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
          @"
          ## No hang this run
          Will retry on the next schedule (every 4h) or manual dispatch.
          Increase ``build_rounds`` / ``max_search_attempts`` in workflow inputs if needed.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
